<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Zacky's Lava Quest</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    background: #000;
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh;
  }

  /* ─── GAME CANVAS: always 1920x1080, scaled to fit any screen ─── */
  #game-canvas {
    position: relative;
    width: 1920px; height: 1080px;
    overflow: hidden;
    transform-origin: center center;
    background: #1a0500;
    flex-shrink: 0;
  }

  /* ─── SCREENS ─── */
  .screen {
    width: 100%; height: 100%;
    position: absolute; inset: 0;
    display: none; opacity: 0;
    transition: opacity 0.5s ease-in-out;
    background-size: cover; background-position: center;
  }
  .screen.active { display: block; opacity: 1; }

  /* ─── TITLE SCREEN ─── */
  #title { background-image: url('lava_title.jpg'); }
  .press {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); color: #fff; border: 5px solid #ffd84d; border-radius: 40px;
    padding: 14px 44px; font-size: 54px; text-shadow: 2px 2px 0 #000; white-space: nowrap;
  }
  #titleCar { position: absolute; left: 0; top: 437px; width: 400px; height: 379px; z-index: 1; display: none; pointer-events: none; animation: carDrive 11s linear infinite; }
  @keyframes carDrive { from { transform: translateX(-460px); } to { transform: translateX(1980px); } }
  #title .press { bottom: 150px; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.45; } }

  /* ─── LEVEL 1 ─── */
  #level1 { background: #1a0500 url('lava_level1.jpg') center/cover no-repeat; }
  #level1 .abs, #level2 .abs { position: absolute; user-select: none; -webkit-user-drag: none; }
  .platform { height: 80px; }
  #zacky.blink { animation: blinkz 0.2s steps(2) infinite; }
  @keyframes blinkz { 50% { opacity: 0.3; } }
  #flash { position: absolute; inset: 0; background: rgba(255,60,0,0.45); opacity: 0; pointer-events: none; z-index: 40; transition: opacity 0.5s; }
  #flash.on { opacity: 1; transition: none; }
  .flag { width: 8px; height: 110px; background: #ddd; border-radius: 4px; z-index: 3; }
  .flag::after { content: ''; position: absolute; left: 8px; top: 6px; border-left: 50px solid #888; border-top: 22px solid transparent; border-bottom: 22px solid transparent; }
  .flag.on::after { border-left-color: #3ddc84; }
  #level2 { background: #1a0500 url('lava_level2.jpg') center/cover no-repeat; }
  #celebrate { background: #1a0500; overflow: hidden; }
  #celebrate .cel-bg { position: absolute; inset: 0; background: url('celebration.png') center/cover no-repeat; transform-origin: 38% 62%; animation: celZoom 16s ease-in-out infinite alternate; }
  @keyframes celZoom { from { transform: scale(1) translateY(0); } to { transform: scale(1.07) translateY(-8px); } }
  #celebrate .spark { position: absolute; width: 46px; height: 46px; background: #fff6b0; filter: drop-shadow(0 0 10px #ffd84d); clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%); opacity: 0; animation: celTwinkle 2.8s ease-in-out infinite; pointer-events: none; }
  @keyframes celTwinkle { 0%,100% { opacity: 0; transform: scale(.3) rotate(0deg); } 50% { opacity: .95; transform: scale(1) rotate(45deg); } }
  @media (prefers-reduced-motion: reduce) { #celebrate .cel-bg { animation: none; } #celebrate .spark { animation: none; opacity: .7; transform: none; } }
  #celebrate .press { bottom: 60px; animation: blink 1.4s ease-in-out infinite; }
  #hud, #hud2 { position: absolute; left: 40px; top: 30px; z-index: 30; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.55); border: 4px solid #ffd84d; border-radius: 40px; padding: 10px 26px; color: #fff; font-size: 48px; text-shadow: 2px 2px 0 #000; }
  #hint, #hint2 { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 30; opacity: 0; transition: opacity 0.3s; background: rgba(0,0,0,0.65); color: #fff; border: 5px solid #ffd84d; border-radius: 40px; padding: 12px 40px; font-size: 48px; text-shadow: 2px 2px 0 #000; white-space: nowrap; }
  #hint.on, #hint2.on { opacity: 1; }
  .keycap { display: inline-block; min-width: 120px; text-align: center; padding: 0 22px; margin: 0 6px; border-radius: 14px; background: #f4f4f4; color: #222; border: 4px solid #999; border-bottom-width: 12px; text-shadow: none; font-size: 40px; line-height: 64px; vertical-align: middle; }
  .splashpuff { z-index: 8; transform-origin: 50% 80%; animation: puff 0.7s ease-out forwards; pointer-events: none; }
  @keyframes puff { 0% { opacity: 0; scale: 0.4; } 25% { opacity: 1; scale: 1; } 100% { opacity: 0; scale: 1.25; } }
  .hurt { animation: hurt 0.3s; }
  @keyframes hurt { 0%, 100% { translate: 0 0; } 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
  .blaster { z-index: 6; animation: bob 1.2s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { margin-top: 0; } 50% { margin-top: -14px; } }
  .gem.got { display: none; }
  .door.locked { filter: grayscale(0.85) brightness(0.55); }
  .door.open { filter: drop-shadow(0 0 28px #ffd84d); }
  .tip { z-index: 6; font-size: 34px; color: #fff; background: rgba(0,0,0,0.6); border: 4px solid #ffd84d; border-radius: 28px; padding: 4px 22px; text-shadow: 2px 2px 0 #000; white-space: nowrap; transform: translateX(-50%); }
  #zacky { position: absolute; left: 0; top: 0; width: 133px; height: 200px; transform-origin: 66px 166px; z-index: 20; will-change: transform; }

  /* ─── END OF LEVEL ─── */
  #transition { background: #000 url('lava_title_clean.jpg') center/cover no-repeat; }
  #tvid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; display: none; }
  #complete { background: #1a0500 url('lava_title_clean.jpg') center/cover no-repeat; text-align: center; }
  #complete h1 { position: absolute; left: 0; right: 0; top: 250px; font-size: 140px; color: #ffd84d; text-shadow: 6px 6px 0 #5a1500, 0 0 40px #ff6a00; }
  #gemRow { position: absolute; left: 0; right: 0; top: 450px; display: flex; justify-content: center; gap: 36px; }
  #gemRow img { width: 110px; height: 129px; filter: drop-shadow(0 0 22px #ff6a00) drop-shadow(3px 3px 0 #000); opacity: 0; transform: scale(0.2); }
  #gemRow img.miss { filter: grayscale(1) brightness(0.45) drop-shadow(3px 3px 0 #000); }
  #complete.active #gemRow img { animation: gempop 0.45s ease-out forwards; }
  #complete.active #gemRow img:nth-child(2) { animation-delay: 0.15s; } #complete.active #gemRow img:nth-child(3) { animation-delay: 0.3s; }
  #complete.active #gemRow img:nth-child(4) { animation-delay: 0.45s; } #complete.active #gemRow img:nth-child(5) { animation-delay: 0.6s; }
  @keyframes gempop { 0% { opacity: 0; transform: scale(0.2); } 70% { opacity: 1; transform: scale(1.25); } 100% { opacity: 1; transform: scale(1); } }
  #complete .press { bottom: 190px; animation: blink 1.4s ease-in-out infinite; }
  #zacky { transition: opacity 0.5s; }
  #loading { display: block; opacity: 1; background: #1a0500; color: #ffd84d; font-size: 56px; text-align: center; padding-top: 480px; }
</style>
</head>
<body>
<div id="game-canvas">
  <div id="loading" class="screen">Loading…</div>

  <!-- ════════════════════ TITLE ════════════════════ -->
  <div id="title" class="screen">
    <img id="titleCar" alt="">
    <div class="press">Press any key to start</div>
  </div>

  <!-- ════════════════════ TRANSITION + LEVEL COMPLETE ════════════════════ -->
  <div id="transition" class="screen"><video id="tvid" playsinline preload="auto"></video></div>
  <div id="complete" class="screen">
    <h1>Level 1 complete!</h1>
    <div id="gemRow" aria-label="gems found"></div>
    <div class="press">Press Enter for level 2</div>
  </div>

  <!-- ════════════════════ LEVEL 1 ════════════════════ -->
  <div id="level1" class="screen">
    <div id="world"></div>
    <div id="hud"></div>
    <div id="hint">Collect all 5 gems to open the door!</div>
    <img id="zacky" src="Zacky_stand.png" alt="Zacky">
    <div id="flash"></div>
  </div>

  <!-- ════════════════════ LEVEL 2 ════════════════════ -->
  <div id="level2" class="screen">
    <div id="world2"></div>
    <div id="hud2"></div>
    <div id="hint2"></div>
  </div>
  <div id="celebrate" class="screen"><div class="cel-bg"></div><div id="sparks"></div><div class="press">Press Enter</div></div>
</div>

<audio id="titleMusic" src="Lava_Title_Music.mp3" loop preload="auto"></audio>
<audio id="levelMusic" src="Lava_Level_Music.mp3" loop preload="auto"></audio>
<audio id="walkSfx" src="walking.mp3" loop preload="auto"></audio>
<audio id="jumpSfx" src="jump.mp3" preload="auto"></audio>
<audio id="hissSfx" src="lava_hiss.mp3" preload="auto"></audio>
<audio id="boingSfx" src="boing.mp3" preload="auto"></audio>   <!-- placeholder synth boing for the lava bounce; replace the file to change it -->
<audio id="level2Music" src="Lava_Level2_Music.mp3" loop preload="auto"></audio>
<audio id="pickupSfx" src="pickup.mp3" preload="auto"></audio>
<audio id="sprayAudio" src="water_spray.mp3" preload="auto"></audio>
<audio id="coolAudio" src="monster_cool.mp3" preload="auto"></audio>
<audio id="completeSfx" src="level_complete.mp3" preload="auto"></audio>
<audio id="gemSfx" src="gem_collect.mp3" preload="auto"></audio>
<audio id="biscuitVoice" src="biscuit_voice.mp3" preload="auto"></audio>   <!-- placeholder yips: drop the real biscuit_voice.mp3 over this file (dev/sync_assets.sh does it) -->

<script src="shared.js"></script>
<script>
/* ═══════════════ LEVEL 2 SETTINGS (change a value here, or set window.ZACKY_L2_CONFIG = { ... } before the page script, to retune level 2 without touching code) ═══════════════ */
const L2_DEFAULTS = {
  walkSpeed: 420,            // px/s (level 1 is 420)
  monsterCount: 3,           // hot lava monsters, 0 to 3 (the first N of the list below)
  monsterSpeed: 60,          // px/s, slow on purpose
  hitsToCoolMonster: 1,      // water hits to cool one monster
  hitsToCoolPool: 1,         // water hits to turn one lava pool into a rock bridge
  blobSpeed: 520,            // px/s, a slow big blob
  maxBlobs: 3,               // blobs on screen at once
  sprayCooldown: 0.35,       // seconds between sprays (holding Enter never floods)
  hintOn: true               // the "Press Enter to splash!" hint
};
const L2_CFG = Object.assign({}, L2_DEFAULTS, window.ZACKY_L2_CONFIG || {});
/* ═══════════════ STAGE SCALING (same as games 1 and 2) ═══════════════ */
window.STAGE_SCALE = 1;
(function () {
  var DESIGN_W = 1920, DESIGN_H = 1080;
  var canvas = document.getElementById('game-canvas');
  function resize() {
    var scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
    canvas.style.transform = 'scale(' + scale + ')';
    window.STAGE_SCALE = scale;
  }
  resize();
  window.addEventListener('resize', resize);
  document.addEventListener('fullscreenchange', function () { setTimeout(resize, 100); });
})();

/* ═══════════════ INPUT: keyboard allowlist, pointer lockout ═══════════════ */
['mousedown', 'mouseup', 'click', 'dblclick', 'contextmenu', 'wheel', 'touchstart', 'touchend', 'touchmove']
  .forEach(function (evtName) {
    document.addEventListener(evtName, function (e) { e.preventDefault(); e.stopPropagation(); },
      { capture: true, passive: false });
  });

const ALLOWED_KEYS = new Set([' ', 'Enter', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Escape']);
const keys = {};            // currently held keys
const keyHandlers = [];     // fn(key, isRepeat) called on each keydown
document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;                 // browser shortcuts (Ctrl+R, Alt+Left, Cmd+W...) are left alone, never start or move the game
  if (stage === 'title') {
    // title screen: ANY key starts the game (letters, numbers, Shift, Tab...), except F1-F12 and Esc
    if (/^F\d+$/.test(e.key) || e.key === 'Escape') return;       // F1-F12 stay browser keys, and Esc stays free to leave fullscreen: neither starts the game
    e.preventDefault();                                           // Tab must not move focus off the page
    if (e.repeat) return;                                         // a held key never counts, and never double-fires
    keys[e.key] = true;
    unlockAudio();
    keyHandlers.forEach(function (fn) { fn(e.key, false); });
    return;
  }
  if (!ALLOWED_KEYS.has(e.key)) { e.preventDefault(); return; }
  if (e.key !== 'Escape') e.preventDefault();      // page never scrolls
  keys[e.key] = true;
  unlockAudio();
  keyHandlers.forEach(function (fn) { fn(e.key, e.repeat); });
}, { capture: true });
document.addEventListener('keyup', function (e) { delete keys[e.key]; });
window.addEventListener('blur', function () { for (var k in keys) delete keys[k]; });

/* ═══════════════ AUDIO UNLOCK: sound only starts after the first key press ═══════════════ */
let audioUnlocked = false;
const audioUnlockHandlers = [];
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  audioUnlockHandlers.forEach(function (fn) { fn(); });
}

/* ═══════════════ PRELOADER ═══════════════ */
/* Title art hooks. TITLE_BG: a title background with the title text but NO car. TITLE_CAR: a transparent PNG of Zacky's car that loops left to right over it.
   Either one may be null: then the plain lava_title.jpg (car baked in) shows, with no animation. dev/sync_assets.sh builds title_bg.jpg and copies zacky_car.png from /workspace/zacky3/assets/. */
const TITLE_BG = window.ZACKY_TITLE_BG !== undefined ? window.ZACKY_TITLE_BG : 'title_bg.jpg';
const TITLE_CAR = window.ZACKY_TITLE_CAR !== undefined ? window.ZACKY_TITLE_CAR : 'zacky_car.png';
(function () {
  if (!TITLE_BG || !TITLE_CAR) return;                  // the animated title needs both (the car must not be baked into the background)
  document.getElementById('title').style.backgroundImage = "url('" + TITLE_BG + "')";
  var car = document.getElementById('titleCar'); car.src = TITLE_CAR; car.style.display = 'block';
})();
const PRELOAD = ['lava_title.jpg', 'lava_level1.jpg', 'lava_platform.png', 'lava_pool.png', 'lava_monster.png', 'gem.png', 'exit_door.png', 'friendly_character.png', 'friend_speech.png', 'lava_title_clean.jpg', 'Zacky_stand.png', 'Zacky_walking.png', 'Zacky_climb.png', 'Zacky_jump.png', 'lava_level2.jpg', 'lava_pool2.png', 'rock_bridge.png', 'lava_monster_hot.png', 'lava_monster_cooled.png', 'water_blob.png', 'splash.png', 'water_blaster.png', 'Zacky_blaster.png', 'Zacky_blaster_walk.png', 'celebration.png'].concat(TITLE_BG && TITLE_CAR ? [TITLE_BG, TITLE_CAR] : []);
function preload(urls) {
  var jobs = urls.map(function (u) {
    return new Promise(function (resolve) {
      var i = new Image();
      i.onload = i.onerror = function () { resolve(); };
      i.src = u;
      (window._pre = window._pre || []).push(i);
    });
  });
  // never hang on a slow or missing file
  var timeout = new Promise(function (resolve) { setTimeout(resolve, 6000); });
  return Promise.race([Promise.all(jobs), timeout]);
}
preload(PRELOAD).then(function () {
  document.getElementById('loading').classList.remove('active');
  document.getElementById('loading').style.display = 'none';
  showScreen('title', function () { playMusic(titleMusic); });
  window.gameReady = true;
});

/* ═══════════════ MUSIC ═══════════════ */
const titleMusic = document.getElementById('titleMusic');
const levelMusic = document.getElementById('levelMusic');
const level2Music = document.getElementById('level2Music');
const walkSfx = document.getElementById('walkSfx');
const jumpSfx = document.getElementById('jumpSfx');
const hissSfx = document.getElementById('hissSfx');
const boingSfx = document.getElementById('boingSfx');
const gemSfx = document.getElementById('gemSfx');
const completeSfx = document.getElementById('completeSfx');
const biscuitVoice = document.getElementById('biscuitVoice');
// after the jingle, the cheerful title tune keeps the "Level complete" and celebration screens from going silent (Enter then carries on from it)
function celebrateMusic() {
  if (stage !== 'complete' && stage !== 'celebrate') return;
  if (!completeSfx.paused && !completeSfx.ended) return;           // jingle still going: its 'ended' event calls this again
  if (currentMusic !== titleMusic) playMusic(titleMusic);
}
completeSfx.addEventListener('ended', celebrateMusic);
function sfx(a, vol) { if (!audioUnlocked) return; a.currentTime = 0; a.volume = vol || 0.6; a.play().catch(function () {}); }
let currentMusic = null;
function playMusic(track) {
  if (currentMusic && currentMusic !== track) { currentMusic.pause(); currentMusic.currentTime = 0; }
  currentMusic = track;
  if (!track || !audioUnlocked) return;       // nothing plays before the first key press
  track.volume = 0.5;
  track.play().catch(function () {});
}
function stopMusic() {
  if (currentMusic) { currentMusic.pause(); currentMusic.currentTime = 0; currentMusic = null; }
}
// first key press: start whatever music belongs to the current screen
audioUnlockHandlers.push(function () { if (currentMusic) { var t = currentMusic; currentMusic = null; playMusic(t); } });

/* ═══════════════ SCREENS ═══════════════ */
(function buildSparks() {                                // a few twinkling stars over the celebration picture (motion is switched off by prefers-reduced-motion)
  var host = document.getElementById('sparks'), spots = [[260, 150], [620, 90], [1020, 60], [1500, 120], [1700, 330], [200, 520], [760, 380], [1240, 300], [1560, 640], [420, 760], [980, 620], [1760, 800]];
  spots.forEach(function (s, i) {
    var e = document.createElement('i'); e.className = 'spark';
    e.style.left = s[0] + 'px'; e.style.top = s[1] + 'px'; e.style.animationDelay = (i * 0.37) + 's'; e.style.animationDuration = (2.4 + (i % 4) * 0.5) + 's';
    var sz = 30 + (i % 3) * 14; e.style.width = e.style.height = sz + 'px'; host.appendChild(e);
  });
})();
const screens = { title: document.getElementById('title'), level1: document.getElementById('level1'), level2: document.getElementById('level2'), celebrate: document.getElementById('celebrate'),
  transition: document.getElementById('transition'), complete: document.getElementById('complete') };
let stage = 'loading', screenLocked = false;
function showScreen(name, onReady) {
  screenLocked = true;
  var cur = document.querySelector('.screen.active');
  if (cur) cur.classList.remove('active');
  setTimeout(function () {
    Object.values(screens).forEach(function (el) { el.style.display = 'none'; el.classList.remove('active'); });
    var el = screens[name];
    el.style.display = 'block';
    stage = name;
    celebrateMusic();
    setTimeout(function () { el.classList.add('active'); }, 30);
    if (onReady) onReady();
    setTimeout(function () { screenLocked = false; }, 400);
  }, cur ? 450 : 0);
}

/* ═══════════════ TITLE → LEVEL 1 ═══════════════ */
const LEVEL_MUSIC_DELAY = 1200;
function startLevel1() {
  // the title music keeps playing through the fade and a short beat (so an Enter-first key still gets to hear it), then the level music takes over
  showScreen('level1', function () { mountZacky('level1'); setRig(PLATFORMS, { stand: 'Zacky_stand.png', walk: 'Zacky_walking.png', jump: 'Zacky_jump.png' }, WALK_SPEED); resetLevel(); setTimeout(function () { if (stage === 'level1' && !state.finished) playMusic(levelMusic); }, LEVEL_MUSIC_DELAY); });
}
keyHandlers.push(function (key, isRepeat) {
  if (screenLocked) return;
  if (stage === 'title') { startLevel1(); return; }              // any key starts; the same key press goes no further into the game
  if (stage === 'level1' && ZackyShared.isJumpKey(key)) { ZackyShared.pressJump(player); bounceHint.clear(); }
  if (stage === 'level1' && key === 'Enter' && !state.finished) talkToPup();
  if (stage === 'transition' && key === 'Enter') endTransition();
  if (stage === 'complete' && key === 'Enter') startLevel2();                       // level 1 -> level 2
  if (stage === 'level2') level2Key(key, isRepeat);
  if (stage === 'celebrate' && key === 'Enter') showScreen('title', function () { playMusic(titleMusic); });
});

/* ═════════════════════════════════════════════════
   LEVEL 1  (all coordinates are 1920x1080 stage pixels, y grows downward)
════════════════════════════════════════════════= */
const FLOOR_Y = 830;                                   // Zacky's feet line, on the ground strip of lava_level1.jpg (it starts ~790)
const PLATFORMS = [                                    // one-way: Zacky lands on the top, can jump up through
  { x: 520,  y: 660, w: 400 },
  { x: 1060, y: 660, w: 400 },
];
const POOLS = [                                        // lava pools sit on the floor: touching one pops Zacky back to its near edge (soft bounce, no penalty)
  { x: 460,  w: 240 },
  { x: 1000, w: 240 },
];
const POOL_SURFACE = FLOOR_Y - 40;                     // feet below this line inside a pool = touching lava
const CHECKPOINTS = [{ x: 100 }, { x: 850 }, { x: 1420 }];         // the first is the spawn point
const SPAWN = { x: 100, y: FLOOR_Y };
const FLAG_DX = -150;                                  // checkpoint flags are drawn this far left of the respawn spot (the spot is where Zacky stands, and the flag sat on his face)
const MONSTER = { min: 1520, max: 1600, speed: 80, w: 70, h: 80, sprite: 150 };   // patrols the floor (x = centre)
let walkSpeed = 420;                                   // Zacky's walking speed in the level being played
let curPlatforms = PLATFORMS;                         // the platforms of the level being played (level 2 has none)
let curPoses = { stand: 'Zacky_stand.png', walk: 'Zacky_walking.png', jump: 'Zacky_jump.png' };   // level 2 swaps these for the blaster poses
const WALK_SPEED = 420, GRAVITY = 2600, JUMP_V = 1100, MAX_FALL = 1500;
const GEMS = [{ x: 620, y: 600 }, { x: 820, y: 600 }, { x: 1160, y: 600 }, { x: 1360, y: 600 }, { x: 1600, y: 620, reach: 150 }];   // 1-4 sit above the platforms, 5 is over the monster, with a wider pickup so it can be grabbed from just before the monster (centres)
const PUP = { x: 330, h: 190 };                         // Biscuit the Shiba pup (x = centre)
const DOOR = { x: 1805, h: 210 };                       // the exit cave (x = centre), opens when all 5 gems are collected
const BUBBLE_FAR = 300;                                 // Zacky this far from Biscuit: his bubble closes, even the auto-opened one
const PUP_GREET = 150;                                  // Zacky this close to Biscuit for the first time: the hint opens by itself
const DOOR_REACH = 100;                                 // touching the door: this close sideways (the right edge of the stage is 75 away, so it can't be overshot)
const GEM_REACH = 115;                                  // a gem is picked up when Zacky's centre is this close sideways (about where the sprites visibly touch)
const GEM_HEAD = 234;                                     // gem pickups use the head height from before Zacky grew 1.1x, so no gem becomes easier to grab from the floor
const LAVA_EDGE = 25;                                   // how far a foot may overhang the lava edge safely (was 15 before Zacky was scaled up)

/* ═══════════════ END OF LEVEL: transition clip (optional) → "Level 1 complete" ═══════════════
   With no clip, "Level 1 complete" shows straight away (about 0.8s after the door: the step-in plus one fade). With a clip, the clip plays first; if it fails to load or play, the still shows for STILL_MS and the game carries on.
   Set window.ZACKY_TRANSITION_VIDEO (or the constant below) to the clip's file name, e.g. 'Lava_Transition.mp4'. */

function startTransition() {
  stopMusic(); walkSfx.pause();
  if (!TRANSITION_VIDEO) { transitionDone = true; showScreen('complete'); return; }   // no clip: straight to "Level 1 complete" (no blank still, no wait)
  transitionDone = false;
  showScreen('transition', function () {
    var vid = document.getElementById('tvid');
    function fail() { if (transitionDone) return; vid.style.display = 'none'; transitionTimers.forEach(clearTimeout); later(endTransition, STILL_MS); }
    vid.onerror = fail;
    vid.onended = endTransition;
    vid.onplaying = function () { vid.style.display = 'block'; };
    later(function () { if (vid.readyState < 3 || vid.paused) fail(); }, VIDEO_START_MS);   // never started: use the still
    later(endTransition, VIDEO_MAX_MS);                                                        // never ended: move on
    vid.src = TRANSITION_VIDEO;
    var pr = vid.play(); if (pr && pr.catch) pr.catch(fail);
  });
}
function endTransition() {
  if (transitionDone) return;
  transitionDone = true;
  transitionTimers.forEach(clearTimeout); transitionTimers = [];
  var vid = document.getElementById('tvid');
  try { vid.pause(); } catch (e) {}
  vid.removeAttribute('src'); vid.style.display = 'none';
  showScreen('complete');
}
function updateBounce(dt, st) {                          // Zacky is mid-hop out of the lava: a fixed path, no input (st = the level's state)
  st = st || state;

  player.face = st.bounce.side;                       // faces the way he is going
  player.onGround = !flying; player.jumpBuffer = 0; player.coyote = 0;
  player.pose = flying ? curPoses.jump : curPoses.stand;
  if (!zackyEl.src.endsWith(player.pose)) zackyEl.src = player.pose;
  if (!walkSfx.paused) walkSfx.pause();
  if (!flying) st.bounce = null;
}
function updatePlayer(dt) {
  var dir = (keys['ArrowRight'] ? 1 : 0) - (keys['ArrowLeft'] ? 1 : 0);
  player.vx = dir * walkSpeed;
  if (dir) player.face = dir;
  if (ZackyShared.stepJump(player, dt)) {                // on the ground, or within 120ms of leaving a ledge
    player.vy = -JUMP_V; player.onGround = false; sfx(jumpSfx, 0.5);
  }
  var prevY = player.y;
  player.x = Math.min(STAGE_W - HALF_W - 12, Math.max(HALF_W + 12, player.x + player.vx * dt));   // can't leave the stage
  player.vy = Math.min(MAX_FALL, player.vy + GRAVITY * dt);
  player.y += player.vy * dt;
  // landing: the floor, or the top of a platform we were above last frame
  var land = null;
  if (player.vy >= 0) {
    if (prevY <= FLOOR_Y && player.y >= FLOOR_Y) land = FLOOR_Y;
    curPlatforms.forEach(function (p) {
      if (ZackyShared.overPlatform(player.x, HALF_W, p.x, p.w) && prevY <= p.y + 0.01 && player.y >= p.y) land = Math.min(land === null ? 1e9 : land, p.y);
    });
  }
  if (player.y > FLOOR_Y) land = FLOOR_Y;                              // never below the floor
  if (land !== null) { player.y = land; player.vy = 0; player.onGround = true; }

  player.walkT += moving ? dt : 0;
  if (!zackyEl.src.endsWith(pose)) zackyEl.src = pose;
  player.pose = pose;
  if (moving && audioUnlocked) { if (walkSfx.paused) { walkSfx.volume = 0.5; walkSfx.play().catch(function () {}); } }
  else if (!walkSfx.paused) walkSfx.pause();
}

// ─── hazards ───
function updateHazards(dt) {
  // patrolling lava monster
  state.monsterX += state.monsterDir * MONSTER.speed * dt;
  if (state.monsterX >= MONSTER.max) { state.monsterX = MONSTER.max; state.monsterDir = -1; }
  if (state.monsterX <= MONSTER.min) { state.monsterX = MONSTER.min; state.monsterDir = 1; }
  // checkpoints: walk past a flag to save your place
  CHECKPOINTS.forEach(function (c, i) {
    if (i > state.checkpoint && Math.abs(player.x - c.x) < 60) {
      state.checkpoint = i;
      flagEls.forEach(function (f, k) { f.classList.toggle('on', k <= i); });
    }
  });
  if (state.bounce) return;                             // mid-hop: nothing can touch him
  // lava is gentle: it only bounces him out (even right after a respawn), it never costs anything
  var pool = ZackyShared.findLavaPool(player, POOLS, { halfW: HALF_W, edge: LAVA_EDGE, surfaceY: POOL_SURFACE });
  if (pool) { startLavaBounce(pool); return; }
  if (player.invuln > 0) {
    player.invuln -= dt;
    if (player.invuln <= 0) zackyEl.classList.remove('blink');
    return;
  }
  var l = player.x - HALF_W, r = player.x + HALF_W, top = player.y - BODY_H;
  var hitMonster = r > state.monsterX - MONSTER.w / 2 && l < state.monsterX + MONSTER.w / 2 &&
                   player.y > FLOOR_Y - MONSTER.h && top < FLOOR_Y;
  if (hitMonster) sendToCheckpoint();
}

function talkToPup2() {

  state2.bubbleStay = false;
  var wasShut = bubble2El.style.display === 'none';
  state2.bubbleT = 6; bubble2El.style.display = 'block'; tip2El.style.display = 'none';
  if (wasShut) sfx(biscuitVoice, 0.9);                          // Biscuit speaks when his bubble opens, not again on every Enter
}
function updatePup2(dt) {
  var near = nearPup2();
  if (!state2.pupGreeted && Math.abs(player.x - L2_PUP.x) <= L2_PUP.talk) { state2.pupGreeted = true; talkToPup2(); state2.bubbleStay = true; }   // first visit: he says hello by himself
  if (state2.bubbleT > 0) {
    state2.bubbleT -= dt;
    if (state2.bubbleT <= 0 || Math.abs(player.x - L2_PUP.x) > BUBBLE_FAR || (!near && !state2.bubbleStay)) closeBubble2();
  }
  tip2El.style.display = (near && state2.bubbleT <= 0 && !state2.hasBlaster) ? 'block' : 'none';
}
function level2Key(key, isRepeat) {
  if (state2.finished) return;
  if (ZackyShared.isJumpKey(key)) { ZackyShared.pressJump(player); bounceHint.clear(); }
  if (key === 'Enter') { if (nearPup2() && !state2.hasBlaster) talkToPup2(); else if (!isRepeat) spray2(); }       // next to Biscuit Enter talks only while Zacky is unarmed; holding Enter never repeats a spray
}
const BLOB_W = 58, BLOB_LIFE = 1920;                              // a blob travels about one screen width, then vanishes
var BLOB_GROUND_Y = FLOOR_Y - 70, BLOB_DROP = 1400;           // the height of a splash sprayed standing up, and how fast a higher one falls to it (px/s)
function spray2() {
  if (!state2.hasBlaster || state2.sprayCd > 0 || blobs2.length >= L2_CFG.maxBlobs) return;
  state2.sprayCd = L2_CFG.sprayCooldown; state2.sprayed = true; state2.fired++; if (/splash/.test(state2.hintHtml)) state2.hintT = 0;
  var e = document.createElement('img'); e.src = 'water_blob.png'; e.alt = ''; e.className = 'abs blob';
  e.style.cssText = 'width:' + BLOB_W + 'px;z-index:7;left:0;top:0';
  world2El.appendChild(e);
  var b = { x: player.x + player.face * 70, y: player.y - 70, dir: player.face, travel: 0, el: e };      // muzzle of the blaster
  blobs2.push(b); drawBlob(b); sfx(document.getElementById('sprayAudio'), 0.7);
}
function drawBlob(b) { b.el.style.transform = 'translate(' + (b.x - BLOB_W / 2) + 'px,' + (b.y - 40) + 'px)'; }
function removeBlob(b) { var i = blobs2.indexOf(b); if (i >= 0) blobs2.splice(i, 1); b.el.remove(); }
function updateBlobs2(dt) {
  if (state2.sprayCd > 0) state2.sprayCd -= dt;
  blobs2.slice().forEach(function (b) {
    var d = L2_CFG.blobSpeed * dt; b.x += b.dir * d; b.travel += d;
    if (b.y < BLOB_GROUND_Y) b.y = Math.min(BLOB_GROUND_Y, b.y + BLOB_DROP * dt);   // sprayed mid-jump: the splash drops to pool/monster height, so it still hits them
    if (blobHits2(b)) { removeBlob(b); return; }
    if (b.travel > BLOB_LIFE || b.x < -BLOB_W || b.x > 1920 + BLOB_W) { removeBlob(b); return; }
    drawBlob(b);
  });
}
function updateHazards2(dt) {
  L2_CHECKPOINTS.forEach(function (c, i) {
    if (i > state2.checkpoint && Math.abs(player.x - c.x) < 60) {
      state2.checkpoint = i;
      flag2Els.forEach(function (f, k) { f.classList.toggle('on', k <= i); });
    }
  });
  if (state2.bounce) return;
  var pool = ZackyShared.findLavaPool(player, L2_POOLS.filter(function (p) { return !p.bridge; }), { halfW: HALF_W, edge: LAVA_EDGE, surfaceY: POOL_SURFACE });
  if (pool) { closeBubble2(); bounceHint.bump(); state2.bounce = ZackyShared.startBounce(player, pool, BOUNCE); state2.bounces++; sfx(boingSfx, 0.7); return; }
  if (player.invuln > 0) { player.invuln -= dt; if (player.invuln <= 0) zackyEl.classList.remove('blink'); return; }
  var hit = monsters2.some(function (m) {
    return m.active && !m.cooled && player.x + HALF_W > m.x - L2_MON.w / 2 && player.x - HALF_W < m.x + L2_MON.w / 2 && player.y > FLOOR_Y - L2_MON.h && player.y - BODY_H < FLOOR_Y;
  });
  if (hit) sendToCheckpoint2();
}
function sendToCheckpoint2() {                                  // a hot monster: back to the last flag (as level 1), no penalty
  state2.deaths++;
  closeBubble2();
  sfx(hissSfx, 0.6);
  var c = L2_CHECKPOINTS[state2.checkpoint];
  player.x = c.x; player.y = FLOOR_Y; player.vx = 0; player.vy = 0; player.onGround = true; player.jumpBuffer = 0; player.coyote = 0;
  player.invuln = 1.2; zackyEl.classList.add('blink');
  var fl = document.getElementById('flash'); fl.classList.add('on'); setTimeout(function () { fl.classList.remove('on'); }, 80);
}
function updateMonsters2(dt) {
  monsters2.forEach(function (m) {
    if (!m.active) return;
    if (!m.cooled) {
      m.x += m.dir * L2_CFG.monsterSpeed * dt;
      if (m.x >= m.max) { m.x = m.max; m.dir = -1; } else if (m.x <= m.min) { m.x = m.min; m.dir = 1; }
    }
    m.el.style.transform = 'translateX(' + m.x + 'px) translateX(-50%) scaleX(' + (m.cooled ? 1 : m.dir) + ')';
  });
}
function coolMonster2(m) {
  m.hits++;
  if (m.hits < L2_CFG.hitsToCoolMonster) { m.el.classList.remove('hurt'); void m.el.offsetWidth; m.el.classList.add('hurt'); puffSplash(m.x, FLOOR_Y - 60); return; }
  m.cooled = true; m.el.src = 'lava_monster_cooled.png'; m.el.classList.add('cooled');
  puffSplash(m.x, FLOOR_Y - 60); sfx(document.getElementById('coolAudio'), 0.8);
}
function coolPool2(i) {
  var p = L2_POOLS[i]; p.hits = (p.hits || 0) + 1;
  puffSplash(p.x + p.w / 2, FLOOR_Y - 60);
  if (p.hits < L2_CFG.hitsToCoolPool) return;
  bounceHint.clear(); p.bridge = true; pool2Els[i].src = 'rock_bridge.png'; pool2Els[i].style.top = (FLOOR_Y - 26) + 'px'; pool2Els[i].classList.add('bridge');
  sfx(document.getElementById('coolAudio'), 0.8);
}
function resetPools2() {
  L2_POOLS.forEach(function (p, i) { p.hits = 0; p.bridge = false; pool2Els[i].src = 'lava_pool2.png'; pool2Els[i].style.top = (FLOOR_Y - 25) + 'px'; pool2Els[i].classList.remove('bridge'); });
}
function blobHits2(b) {
  var pi = L2_POOLS.findIndex(function (p) { return !p.bridge && b.x > p.x && b.x < p.x + p.w && b.y > FLOOR_Y - 210 && b.y < FLOOR_Y + 20; });
  if (pi >= 0) { coolPool2(pi); return true; }                                         // a blob that reaches a hot monster cools it and is used up
  var m = monsters2.find(function (m) { return m.active && !m.cooled && Math.abs(b.x - m.x) < L2_MON.w / 2 + 20 && b.y > FLOOR_Y - L2_MON.sprite - 20 && b.y < FLOOR_Y + 20; });
  if (m) { coolMonster2(m); return true; }
  return false;
}
function updateItems2(dt) {
  updatePup2(dt);
  if (!state2.hasBlaster && Math.abs(player.x - L2_BLASTER.x) < L2_BLASTER.reach) pickUpBlaster();
  L2_GEMS.forEach(function (g, i) {
    var e = gem2Els[i];
    if (e.classList.contains('got')) return;
    if (state2.bounce) return;                           // a lava bounce flies past a gem: it only counts when he hops for it
    if (Math.abs(player.x - g.x) < (g.reach || GEM_REACH) && g.y + 45 > player.y - GEM_HEAD && g.y - 45 < player.y) {
      e.classList.add('got'); state2.gems++; sfx(gemSfx, 0.7); gemHud2.set(state2.gems); setDoor2();
      if (state2.gems >= L2_GEMS.length && /Collect/.test(state2.hintHtml)) state2.hintT = 0;   // the fifth gem is in: the 'collect all 5' hint goes away at once
    }
  });
  if (Math.abs(player.x - L2_DOOR.x) < DOOR_REACH && player.y > FLOOR_Y - 160) {
    if (state2.gems >= L2_GEMS.length) finishLevel2();
    else showHint2('Collect all 5 gems to open the door!', 2.5);
  }
}
function showHint2(html, secs) { state2.hintHtml = html; state2.hintT = secs; }
function pickUpBlaster() {
  state2.hasBlaster = true; blasterEl.style.display = 'none'; curPoses = L2_POSES_BLASTER;
  sfx(document.getElementById('pickupSfx'), 0.8);
  if (L2_CFG.hintOn) showHint2('Press <span class="keycap">Enter</span> to splash!', 6);
}
function finishLevel2() {
  state2.finished = true;
  closeBubble2(); cutVoice();
  walkSfx.pause(); stopMusic(); sfx(completeSfx, 0.8);
  player.x = L2_DOOR.x; player.vx = 0; player.vy = 0; player.y = FLOOR_Y; player.pose = 'Zacky_climb.png'; zackyEl.src = 'Zacky_climb.png';
  setTimeout(function () { zackyEl.style.opacity = '0'; }, 250);
  setTimeout(function () { showScreen('celebrate'); }, 350);
}
const hint2El = document.getElementById('hint2');
function renderLevel2() {
  renderZacky();
  var on = state2.hintT > 0 && !!state2.hintHtml;
  if (on && hint2El.innerHTML !== state2.hintHtml) hint2El.innerHTML = state2.hintHtml;
  hint2El.classList.toggle('on', on);
}

var lastT = 0;
function frame(t) {
  var dt = Math.min(0.033, (t - lastT) / 1000 || 0); lastT = t;
  if (stage === 'level1') { if (!state.finished) { if (state.bounce) updateBounce(dt); else updatePlayer(dt); updateHazards(dt); updateItems(dt); } render(); }
  else if (stage === 'level2') { if (!state2.finished) { if (state2.bounce) updateBounce(dt, state2); else updatePlayer(dt); updateHazards2(dt); updateItems2(dt); updateBlobs2(dt); }  updateMonsters2(state2.finished ? 0 : dt); renderLevel2(); }
  else if (!walkSfx.paused) walkSfx.pause();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
