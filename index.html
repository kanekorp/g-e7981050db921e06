<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<title>Zacky's Paw Patrol Adventure!</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background-color: #000033;
}
.screen {
    width: 100vw;
    height: 100vh;
    position: absolute;
    display: none;
    background-size: cover;
    background-position: center;
    opacity: 0;
    transition: opacity 0.5s ease-in-out;
}
.screen.active {
    display: block;
    opacity: 1;
}
#intro {
    background: linear-gradient(to bottom, #ffcc00, #ff6600);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: white;
    text-shadow: 3px 3px 6px black;
}
#intro img { width: 400px; max-width: 80%; }

#ground { background-image: url('paw_background.jpg'); }
#dinosaur { background-image: url('dinosaur_background.jpg'); }
#launch { background-image: url('Launch_Background.jpg'); }
#space { background-image: url('space_background.jpg'); }
#space-collect { 
    background-image: url('space_collect_background.jpg'); 
}
#battle { background-image: url('battle_background.jpg'); }
#moon {
    background-image: url('moon_background.jpg');
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #001133;
    text-shadow: 1px 1px 4px white;
}

#transition-video-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: #000000;
    display: none;
    z-index: 1000;
    justify-content: center;
    align-items: center;
}

#transition-video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

h1.screen-title {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    font-size: 3.5em;
    text-shadow: 2px 2px 5px black;
}

.zacky {
    position: absolute;
    width: 300px;
    transition: left 0.4s ease, bottom 0.4s ease;
    z-index: 5;
}

.zacky-collect {
    position: absolute;
    width: 300px;
    transition: left 0.3s ease, bottom 0.3s ease, transform 0.3s ease;
    z-index: 5;
}

.collectible {
    position: absolute;
    width: 150px;
    z-index: 4;
    transition: opacity 0.3s ease;
}

.dino {
    position: absolute;
    width: 400px;
    right: 5%;
    bottom: 10%;
    z-index: 4;
}

.dino.shake-dino {
    animation: shakeDino 0.5s;
}

@keyframes shakeDino {
    0% { transform: translate(0, 0) rotate(0deg); }
    25% { transform: translate(-5px, 0) rotate(-2deg); }
    50% { transform: translate(5px, 0) rotate(2deg); }
    75% { transform: translate(-5px, 0) rotate(-2deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
}

/* Launch stage specific styles */
.rocket-tower {
    position: absolute;
    height: 85vh;
    width: auto;
    right: 15%;
    bottom: 5%;
    z-index: 4;
}

.rocket {
    position: absolute;
    height: 85vh;
    width: auto;
    left: 25%;
    bottom: 5%;
    z-index: 4;
    transition: bottom 2s ease-in;
}

.car {
    position: absolute;
    width: 300px;
    z-index: 5;
    transition: left 0.4s ease;
}

.zacky-launch {
    position: absolute;
    width: 200px;
    z-index: 5;
    transition: left 0.4s ease, bottom 0.4s ease;
}

.rocket-smoke {
    position: absolute;
    width: 450px;
    left: 35%;
    bottom: 3%;
    z-index: 6;
}

.countdown-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 8em;
    color: #ff3300;
    text-shadow: 4px 4px 8px black;
    font-weight: bold;
    z-index: 10;
}

/* 🔥 SCREEN SHAKE */
.shake {
    animation: shakeScreen 0.6s infinite;
}
@keyframes shakeScreen {
    0% { transform: translate(0, 0); }
    20% { transform: translate(-10px, 5px); }
    40% { transform: translate(10px, -5px); }
    60% { transform: translate(-8px, 4px); }
    80% { transform: translate(8px, -4px); }
    100% { transform: translate(0, 0); }
}

.shake-monster {
    animation: shakeMonster 0.3s;
}
@keyframes shakeMonster {
    0% { transform: translate(0, 0); }
    25% { transform: translate(-8px, 0); }
    50% { transform: translate(8px, 0); }
    75% { transform: translate(-8px, 0); }
    100% { transform: translate(0, 0); }
}

.shake-monster-continuous {
    animation: shakeMonster 0.3s infinite;
}

.laser {
    position: absolute;
    width: 120px;
    left: 20%;
    bottom: 15%;
    transform: scaleY(6);
    transition: left 1.6s linear;
    z-index: 6;
}

.exhaust {
    position: absolute;
    width: 40px;
    height: 40px;
    background: radial-gradient(circle, orange, red, transparent);
    border-radius: 50%;
    opacity: 0.8;
    animation: fadeOut 0.8s forwards;
    z-index: 3;
}
@keyframes fadeOut {
    to { opacity: 0; transform: scale(2); }
}

.space-mouse {
    position: absolute;
    width: 120px;
    left: 3%;
    bottom: 3%;
    z-index: 6;
}

.moon-monster {
    position: absolute;
    top: 5%;
    left: 5%;
    width: 260px;
    animation: spinShrink 2.5s forwards linear;
    z-index: 4;
}
@keyframes spinShrink {
    0% { transform: rotate(0deg) scale(1); opacity: 1; }
    100% { transform: rotate(720deg) scale(0); opacity: 0; }
}

.battle-monster {
    position: absolute;
    right: 5%;
    bottom: 5%;
    width: 300px;
    z-index: 4;
    transition: bottom 0.4s ease;
}

.battle-monster.boss {
    width: 450px;
    right: 3%;
    bottom: 2%;
}

.battle-monster.moving {
    transition: right 8s linear, bottom 0.4s ease;
}
</style>
</head>
<body>

<audio id="dinoRoar" src="Dino_roar.mp3"></audio>
<audio id="countdownSound" src="countdown.mp3"></audio>
<audio id="rocketLaunchSound" src="rocket_launch.mp3"></audio>
<audio id="walkingSound" src="walking.mp3"></audio>
<audio id="drivingSound" src="driving.mp3"></audio>
<audio id="climbingSound" src="climbing.mp3"></audio>
<audio id="thrustersSound" src="thrusters.mp3"></audio>
<audio id="introMusic" src="Intro_Background.mp3" loop></audio>
<audio id="groundMusic" src="Ground_Background.mp3" loop></audio>
<audio id="dinoMusic" src="Dino_Background.mp3" loop></audio>
<audio id="launchMusic" src="Launch_Background.mp3" loop></audio>
<audio id="spaceMusic" src="Space_Background.mp3" loop></audio>
<audio id="spaceCollectMusic" src="Space_Collect_Background.mp3" loop></audio>
<audio id="battleMusic" src="Battle_Background.mp3" loop></audio>
<audio id="moonMusic" src="Moon_Background.mp3" loop></audio>

<div id="transition-video-container">
    <video id="transition-video" playsinline>
        <source src="Launch_Transition.mp4" type="video/mp4">
    </video>
</div>

<div id="intro" class="screen">
    <img src="zacky_paw.png">
    <h1>Ready, Zacky?!</h1>
    <p>Press SPACE to start!</p>
</div>

<div id="ground" class="screen">
    <h1 class="screen-title">Use Right Arrow!</h1>
    <img id="zacky-ground" class="zacky" src="zacky_side.png" style="left:5%; bottom:10%;">
</div>

<div id="dinosaur" class="screen">
    <h1 class="screen-title">Use Arrow Keys!</h1>
    <img id="zacky-dino" class="zacky" src="zacky_side.png" style="left:5%; bottom:10%;">
    <img id="dino-img" src="dinosaur.png" class="dino">
</div>

<div id="launch" class="screen">
    <h1 class="screen-title" id="launch-title">Drive to the Rocket!</h1>
    <img id="rocket-launch" class="rocket" src="rocket_unmanned.png">
    <img id="tower-launch" class="rocket-tower" src="tower.png">
</div>

<div id="space" class="screen">
    <h1 class="screen-title">Use Right Arrow!</h1>
    <img id="zacky-space" class="zacky" src="zacky_space.png" style="left:5%; bottom:10%; transform: rotate(-20deg);">
</div>

<div id="space-collect" class="screen">
    <h1 class="screen-title">Collect Items and Get to the Moon!</h1>
    <img id="zacky-collect" class="zacky-collect" src="zacky_up.png" style="left:45%; bottom:-20%;">
</div>

<div id="battle" class="screen">
    <img class="zacky" src="zacky_space.png" style="left:5%; bottom:15%;">
</div>

<div id="moon" class="screen">
    <img src="zacky_paw.png" style="width:500px; max-width:70%;">
    <h1>Zacky Made It to the Moon! 🌕🚀</h1>
    <p>You're a super hero, Zacky!</p>
    <p>Press ENTER to play again</p>
</div>

<script>
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const dinoRoar = document.getElementById('dinoRoar');
const countdownSound = document.getElementById('countdownSound');
const rocketLaunchSound = document.getElementById('rocketLaunchSound');
const walkingSound = document.getElementById('walkingSound');
const drivingSound = document.getElementById('drivingSound');
const climbingSound = document.getElementById('climbingSound');
const thrustersSound = document.getElementById('thrustersSound');
const introMusic = document.getElementById('introMusic');
const groundMusic = document.getElementById('groundMusic');
const dinoMusic = document.getElementById('dinoMusic');
const launchMusic = document.getElementById('launchMusic');
const spaceMusic = document.getElementById('spaceMusic');
const spaceCollectMusic = document.getElementById('spaceCollectMusic');
const battleMusic = document.getElementById('battleMusic');
const moonMusic = document.getElementById('moonMusic');

const transitionVideoContainer = document.getElementById('transition-video-container');
const transitionVideo = document.getElementById('transition-video');

let currentMusic = null;
let musicStarted = false;
let mouseInputsLocked = false;

// Sound management variables
let currentMovementSound = null;
let soundTimeout = null;
let lastMovementType = null;

// Battle stage variables
let battleMonster = null;
let battlePhase = 1; // 1: monster1, 2-3: monster2 instances, 4: boss
let monsterHits = 0;
let activeLasers = [];
let monsterMoveInterval = null;
let monster1ShotCount = 0; // Track shots for monster1 dodging

function playMusic(music) {
    // Stop current music
    if (currentMusic) {
        currentMusic.pause();
        currentMusic.currentTime = 0;
    }
    
    // Play new music
    if (music) {
        currentMusic = music;
        music.currentTime = 0;
        music.volume = 0.5;
        music.play().catch(e => console.log('Music play failed:', e));
    }
}

function stopAllMusic() {
    if (currentMusic) {
        currentMusic.pause();
        currentMusic.currentTime = 0;
        currentMusic = null;
    }
}

function playMovementSound(sound, movementType) {
    // If same movement type and sound is still playing, don't restart
    if (currentMovementSound === sound && !sound.paused && lastMovementType === movementType) {
        // Clear existing timeout and set new one
        if (soundTimeout) {
            clearTimeout(soundTimeout);
        }
        soundTimeout = setTimeout(() => {
            sound.pause();
            sound.currentTime = 0;
            currentMovementSound = null;
            lastMovementType = null;
        }, 2000);
        return;
    }
    
    // Different movement type or sound not playing, stop current and start new
    if (currentMovementSound) {
        currentMovementSound.pause();
        currentMovementSound.currentTime = 0;
    }
    
    if (soundTimeout) {
        clearTimeout(soundTimeout);
    }
    
    sound.currentTime = 0;
    sound.volume = 0.5;
    sound.play().catch(e => console.log('Sound failed:', e));
    
    currentMovementSound = sound;
    lastMovementType = movementType;
    
    soundTimeout = setTimeout(() => {
        sound.pause();
        sound.currentTime = 0;
        currentMovementSound = null;
        lastMovementType = null;
    }, 2000);
}

function playTransitionVideo(videoSrc, nextStage) {
    // Lock all inputs
    stageTransitioning = true;
    inputLocked = true;
    
    // Stop all music
    stopAllMusic();
    
    // Show video container
    transitionVideoContainer.style.display = 'flex';
    
    // Set video source
    transitionVideo.src = videoSrc;
    
    // Reset and play video
    transitionVideo.currentTime = 0;
    transitionVideo.play().catch(e => console.log('Video play failed:', e));
    
    // When video ends, transition to next stage
    transitionVideo.onended = () => {
        transitionVideoContainer.style.display = 'none';
        showStage(nextStage);
    };
}

function engineSound(start, end, time) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(start, audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(end, audioCtx.currentTime + time);
    g.gain.value = 0.07;
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + time);
}
const monsterSound = () => engineSound(180, 90, 0.5);
const laserSound = () => engineSound(600, 200, 0.25);

let stage = 1;
let groundLeft = 5;

let dinoLeft = 5;
let dinoBottom = 10;
let reachedDino = false;
let upPresses = 0;

// Launch stage variables
let launchCarLeft = -20;
let launchZackyLeft = 0;
let launchZackyBottom = 10;
let launchCarElement = null;
let launchZackyElement = null;
let launchPhase = 0;
let climbBottom = 10;

let spaceLeft = 5;
let spaceBottom = 10;
let prevLeft = 5;
let prevBottom = 10;
let spacePresses = 0;

let collectLeft = 45;
let collectBottom = 10;
let collectRotation = 0;
let collectibles = ['cake.png', 'donut.png', 'mouse_space.png'];
let currentCollectible = 0;
let collectibleElement = null;
let allCollected = false;

let monster = null;
let mouse = null;
let moonMonster = null;

let inputLocked = false;
let stageTransitioning = false;
const INPUT_DELAY = 400;
const TRANSITION_DELAY = 800;

const intro = document.getElementById('intro');
const ground = document.getElementById('ground');
const dinosaur = document.getElementById('dinosaur');
const launch = document.getElementById('launch');
const space = document.getElementById('space');
const spaceCollect = document.getElementById('space-collect');
const battle = document.getElementById('battle');
const moon = document.getElementById('moon');

const zGround = document.getElementById('zacky-ground');
const zDino = document.getElementById('zacky-dino');
const zSpace = document.getElementById('zacky-space');
const dinoImg = document.getElementById('dino-img');
const launchTitle = document.getElementById('launch-title');
const rocketLaunch = document.getElementById('rocket-launch');

let currentScreen = null;

// Block mouse/trackpad clicks after game starts
document.addEventListener('click', (e) => {
    if (mouseInputsLocked) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

document.addEventListener('mousedown', (e) => {
    if (mouseInputsLocked) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

document.addEventListener('contextmenu', (e) => {
    if (mouseInputsLocked) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
});

function spawnBattleMonster() {
    // Remove existing monster
    if (battleMonster) {
        battleMonster.remove();
        battleMonster = null;
    }
    
    // Stop any movement interval
    if (monsterMoveInterval) {
        clearInterval(monsterMoveInterval);
        monsterMoveInterval = null;
    }
    
    // Create new monster based on phase
    battleMonster = document.createElement('img');
    battleMonster.className = 'battle-monster';
    
    if (battlePhase === 1) {
        battleMonster.src = 'monster_battle1.png';
        battleMonster.style.right = '5%';
        battleMonster.style.bottom = '5%';
        monster1ShotCount = 0;
    } else if (battlePhase === 2 || battlePhase === 3) {
        battleMonster.src = 'monster_battle2.png';
        battleMonster.style.right = '5%';
        battleMonster.style.bottom = '5%';
        battleMonster.classList.add('moving');
        
        // Start moving monster to the left
        setTimeout(() => {
            battleMonster.style.right = '35%'; // Stop near Zacky
        }, 100);
    } else if (battlePhase === 4) {
        battleMonster.src = 'monster_battle_boss.png';
        battleMonster.classList.add('boss');
        battleMonster.style.right = '3%';
        battleMonster.style.bottom = '2%';
    }
    
    battle.appendChild(battleMonster);
    monsterHits = 0;
}

function shootLaser() {
    laserSound();
    const laser = document.createElement('img');
    laser.src = 'Lazer_shot.png';
    laser.className = 'laser';
    battle.appendChild(laser);
    
    activeLasers.push(laser);
    
    setTimeout(() => laser.style.left = '110%', 20);
    
    // Check for collision every 50ms
    const collisionCheck = setInterval(() => {
        if (!battleMonster || !laser.parentNode) {
            clearInterval(collisionCheck);
            return;
        }
        
        const laserRect = laser.getBoundingClientRect();
        const monsterRect = battleMonster.getBoundingClientRect();
        
        // Check if laser hits monster
        if (laserRect.right >= monsterRect.left && 
            laserRect.left <= monsterRect.right &&
            laserRect.bottom >= monsterRect.top &&
            laserRect.top <= monsterRect.bottom) {
            
            // Hit detected!
            laser.remove();
            activeLasers = activeLasers.filter(l => l !== laser);
            clearInterval(collisionCheck);
            
            // Monster1 dodge behavior
            if (battlePhase === 1) {
                monster1ShotCount++;
                if (monster1ShotCount === 1) {
                    // First shot - dodge up
                    battleMonster.style.bottom = '25%';
                    setTimeout(() => {
                        if (battleMonster && battlePhase === 1) {
                            battleMonster.style.bottom = '5%';
                        }
                    }, 500);
                }
            }
            
            // Shake monster
            battleMonster.classList.add('shake-monster');
            setTimeout(() => {
                if (battleMonster) {
                    battleMonster.classList.remove('shake-monster');
                }
            }, 300);
            
            monsterHits++;
            
            // Check if monster is defeated
            let hitsRequired = 2; // monster1
            if (battlePhase === 2 || battlePhase === 3) hitsRequired = 3; // monster2
            if (battlePhase === 4) hitsRequired = 5; // boss
            
            if (monsterHits >= hitsRequired) {
                if (battlePhase === 4) {
                    // Boss defeated - continuous shake then cutscene
                    battleMonster.classList.add('shake-monster-continuous');
                    
                    setTimeout(() => {
                        battle.classList.remove('active');
                        setTimeout(() => {
                            battle.style.display = 'none';
                            playTransitionVideo('Ending.mp4', 6);
                        }, 500);
                    }, 300);
                } else {
                    // Other monsters - remove and spawn next
                    setTimeout(() => {
                        if (battleMonster) {
                            battleMonster.remove();
                            battleMonster = null;
                        }
                        
                        battlePhase++;
                        setTimeout(() => spawnBattleMonster(), 500);
                    }, 300);
                }
            }
        }
    }, 50);
    
    // Remove laser after animation completes
    setTimeout(() => {
        if (laser.parentNode) {
            laser.remove();
        }
        activeLasers = activeLasers.filter(l => l !== laser);
        clearInterval(collisionCheck);
    }, 1700);
}

function showStage(s) {
    // Lock input during transition
    stageTransitioning = true;
    inputLocked = true;
    
    // Stop any movement sounds
    if (currentMovementSound) {
        currentMovementSound.pause();
        currentMovementSound.currentTime = 0;
        currentMovementSound = null;
    }
    if (soundTimeout) {
        clearTimeout(soundTimeout);
        soundTimeout = null;
    }
    lastMovementType = null;
    
    // Fade out current screen
    if (currentScreen) {
        currentScreen.classList.remove('active');
    }
    
    // Wait for fade out, then show new screen
    setTimeout(() => {
        intro.style.display =
        ground.style.display =
        dinosaur.style.display =
        launch.style.display =
        space.style.display =
        spaceCollect.style.display =
        battle.style.display =
        moon.style.display = 'none';

        if (moonMonster) { moonMonster.remove(); moonMonster = null; }

        if (s === 1) {
            intro.style.display = 'flex';
            currentScreen = intro;
            playMusic(introMusic);
        }
        
        if (s === 2) {
            ground.style.display = 'block';
            currentScreen = ground;
            playMusic(groundMusic);
            
            // Reset ground stage
            groundLeft = 5;
            zGround.style.left = '5%';
            zGround.style.bottom = '10%';
        }

        if (s === 3) {
            dinosaur.style.display = 'block';
            currentScreen = dinosaur;

            // Reset dino stage
            dinoLeft = 5;
            dinoBottom = 10;
            reachedDino = false;
            upPresses = 0;
            zDino.style.left = '5%';
            zDino.style.bottom = '10%';
            
            // Remove shake class from dino
            dinoImg.classList.remove('shake-dino');

            // 🔥 Dino roar + shake
            dinoRoar.currentTime = 0;
            dinoRoar.play();

            dinosaur.classList.add('shake');
            setTimeout(() => dinosaur.classList.remove('shake'), 600);
            
            // Play dino music after roar finishes
            setTimeout(() => playMusic(dinoMusic), 1000);
        }

        if (s === 3.5) {
            launch.style.display = 'block';
            currentScreen = launch;
            playMusic(launchMusic);
            
            // Reset launch stage
            launchPhase = 0;
            launchCarLeft = -20;
            launchZackyLeft = 0;
            launchZackyBottom = 10;
            climbBottom = 10;
            
            // Remove any existing elements
            const allZackyLaunch = launch.querySelectorAll('.zacky-launch');
            allZackyLaunch.forEach(el => el.remove());
            const allCars = launch.querySelectorAll('.car');
            allCars.forEach(el => el.remove());
            
            launchCarElement = null;
            launchZackyElement = null;
            
            // Remove any countdown or smoke elements
            const existingCountdown = launch.querySelector('.countdown-text');
            if (existingCountdown) existingCountdown.remove();
            const existingSmoke = launch.querySelector('.rocket-smoke');
            if (existingSmoke) existingSmoke.remove();
            
            // Remove shake class
            launch.classList.remove('shake');
            
            // Reset rocket to unmanned
            rocketLaunch.src = 'rocket_unmanned.png';
            rocketLaunch.style.bottom = '5%';
            
            // Reset title
            launchTitle.textContent = 'Drive to the Rocket!';
            
            // Create car with Zacky in it
            launchCarElement = document.createElement('img');
            launchCarElement.src = 'zacky_side.png';
            launchCarElement.className = 'car';
            launchCarElement.style.left = launchCarLeft + '%';
            launchCarElement.style.bottom = '10%';
            launch.appendChild(launchCarElement);
            
            // Drive in animation
            setTimeout(() => {
                launchCarLeft = 5;
                if (launchCarElement) {
                    launchCarElement.style.left = '5%';
                }
            }, 100);
            
            // Automatic sequence after car arrives
            setTimeout(() => {
                // Phase 1: Zacky gets out of car
                launchPhase = 1;
                if (launchCarElement) {
                    launchCarElement.src = 'car.png';
                }
                
                launchZackyElement = document.createElement('img');
                launchZackyElement.src = 'Zacky_stand.png';
                launchZackyElement.className = 'zacky-launch';
                launchZackyElement.style.left = '12%';
                launchZackyElement.style.bottom = '10%';
                launch.appendChild(launchZackyElement);
                
                launchZackyLeft = 12;
                launchTitle.textContent = 'Walk to the Tower!';
            }, 600);
        }

        if (s === 4) {
            space.style.display = 'block';
            currentScreen = space;
            playMusic(spaceMusic);
            
            // Reset space stage variables
            spaceLeft = 5;
            spaceBottom = 10;
            prevLeft = 5;
            prevBottom = 10;
            spacePresses = 0;
            
            // Reset Zacky position
            zSpace.style.left = '5%';
            zSpace.style.bottom = '10%';
            zSpace.style.transform = 'rotate(-20deg)';
            
            // Remove monster and mouse if they exist
            if (monster) {
                monster.remove();
                monster = null;
            }
            if (mouse) {
                mouse.remove();
                mouse = null;
            }
            
            // Remove any exhaust puffs
            const exhausts = space.querySelectorAll('.exhaust');
            exhausts.forEach(ex => ex.remove());
        }
        
        if (s === 4.5) {
            spaceCollect.style.display = 'block';
            currentScreen = spaceCollect;
            playMusic(spaceCollectMusic);
            
            // Remove ALL existing collectibles
            const allCollectibles = spaceCollect.querySelectorAll('.collectible');
            allCollectibles.forEach(col => col.remove());
            collectibleElement = null;
            
            const zCollect = document.getElementById('zacky-collect');
            zCollect.style.left = '45%';
            zCollect.style.bottom = '-20%';
            zCollect.style.transform = 'rotate(0deg)';
            
            // Remove shake class
            spaceCollect.classList.remove('shake');
            
            // Shake and entrance
            setTimeout(() => {
                spaceCollect.classList.add('shake');
                zCollect.style.bottom = '10%';
            }, 100);
            setTimeout(() => spaceCollect.classList.remove('shake'), 700);
            
            // Spawn first collectible
            setTimeout(() => spawnCollectible(), 800);
            
            collectLeft = 45;
            collectBottom = 10;
            collectRotation = 0;
            currentCollectible = 0;
            allCollected = false;
        }
        
        if (s === 5) {
            battle.style.display = 'block';
            currentScreen = battle;
            
            // Reset battle stage
            battlePhase = 1;
            monsterHits = 0;
            activeLasers = [];
            monster1ShotCount = 0;
            
            // Remove all existing lasers and monsters
            const allLasers = battle.querySelectorAll('.laser');
            allLasers.forEach(laser => laser.remove());
            const allMonsters = battle.querySelectorAll('.battle-monster');
            allMonsters.forEach(mon => mon.remove());
            
            if (monsterMoveInterval) {
                clearInterval(monsterMoveInterval);
                monsterMoveInterval = null;
            }
            
            playMusic(battleMusic);
            
            // Spawn first monster
            setTimeout(() => spawnBattleMonster(), 500);
        }

        if (s === 6) {
            moon.style.display = 'flex';
            currentScreen = moon;
            playMusic(moonMusic);
            
            // Remove existing moon monster if any
            if (moonMonster) moonMonster.remove();
            
            // Use boss monster instead of regular monster_space
            moonMonster = document.createElement('img');
            moonMonster.src = 'monster_battle_boss.png';
            moonMonster.className = 'moon-monster';
            moon.appendChild(moonMonster);
            setTimeout(() => moonMonster?.remove(), 2600);

            const existingMouse = moon.querySelector('img[src="mouse_space.png"]');
            if (!existingMouse) {
                const moonMouse = document.createElement('img');
                moonMouse.src = 'mouse_space.png';
                moonMouse.style.width = '140px';
                moon.appendChild(moonMouse);
            }
        }

        // Fade in new screen
        setTimeout(() => {
            if (currentScreen) {
                currentScreen.classList.add('active');
            }
        }, 50);

        stage = s;
        
        // Unlock input after transition delay
        setTimeout(() => {
            stageTransitioning = false;
            inputLocked = false;
        }, TRANSITION_DELAY);
        
    }, 500);
}

function rocketExhaust(x, y) {
    const puff = document.createElement('div');
    puff.className = 'exhaust';
    puff.style.left = (x - 2) + '%';
    puff.style.bottom = (y - 2) + '%';
    space.appendChild(puff);
    setTimeout(() => puff.remove(), 800);
}

function spawnCollectible() {
    if (currentCollectible >= collectibles.length) return;
    
    // Remove any existing collectible first
    if (collectibleElement) {
        collectibleElement.remove();
        collectibleElement = null;
    }
    
    collectibleElement = document.createElement('img');
    collectibleElement.src = collectibles[currentCollectible];
    collectibleElement.className = 'collectible';
    
    // Spawn in corners - moved inward so Zacky can reach them
    const corners = [
        { left: '15%', bottom: '70%' },
        { left: '75%', bottom: '70%' },
        { left: '75%', bottom: '15%' },
        { left: '15%', bottom: '15%' }
    ];
    const corner = corners[currentCollectible % corners.length];
    collectibleElement.style.left = corner.left;
    collectibleElement.style.bottom = corner.bottom;
    
    spaceCollect.appendChild(collectibleElement);
}

function checkCollision() {
    if (!collectibleElement) return;
    
    const zackyLeft = collectLeft;
    const zackyBottom = collectBottom;
    const itemLeft = parseFloat(collectibleElement.style.left);
    const itemBottom = parseFloat(collectibleElement.style.bottom);
    
    // Larger hitbox (increased from 12 to 18)
    if (Math.abs(zackyLeft - itemLeft) < 18 && Math.abs(zackyBottom - itemBottom) < 18) {
        // Fade out and remove
        collectibleElement.style.opacity = '0';
        setTimeout(() => {
            if (collectibleElement) {
                collectibleElement.remove();
                collectibleElement = null;
            }
        }, 300);
        
        currentCollectible++;
        
        if (currentCollectible >= collectibles.length) {
            allCollected = true;
        } else {
            setTimeout(() => spawnCollectible(), 400);
        }
    }
}

function checkMoonCenter() {
    if (!allCollected) return;
    
    // Wider hit box - check if Zacky is near the center (moon is in center of background)
    if (collectLeft >= 30 && collectLeft <= 60 && collectBottom >= 30 && collectBottom <= 60) {
        setTimeout(() => showStage(5), 500);
    }
}

function launchCountdown() {
    stopAllMusic();
    
    // Play countdown sound
    countdownSound.currentTime = 0;
    countdownSound.volume = 0.7;
    countdownSound.play().catch(e => console.log('Countdown sound failed:', e));
    
    const countdownDiv = document.createElement('div');
    countdownDiv.className = 'countdown-text';
    launch.appendChild(countdownDiv);
    
    let count = 3;
    countdownDiv.textContent = count;
    
    // Start shaking (continuous)
    launch.classList.add('shake');
    
    const countInterval = setInterval(() => {
        count--;
        if (count > 0) {
            countdownDiv.textContent = count;
        } else if (count === 0) {
            countdownDiv.textContent = 'LIFTOFF!';
            
            // Play rocket launch sound
            rocketLaunchSound.currentTime = 0;
            rocketLaunchSound.volume = 0.7;
            rocketLaunchSound.play().catch(e => console.log('Rocket sound failed:', e));
            
            // Add smoke
            const smoke = document.createElement('img');
            smoke.src = 'smoke.png';
            smoke.className = 'rocket-smoke';
            launch.appendChild(smoke);
            
            // Replace rocket with launching version
            rocketLaunch.src = 'rocket_launching.png';
            
            // Launch rocket
            setTimeout(() => {
                rocketLaunch.style.bottom = '120%';
            }, 100);
            
            // Transition to video then chase stage after rocket leaves
            setTimeout(() => {
                launch.classList.remove('shake');
                countdownDiv.remove();
                if (smoke && smoke.parentNode) smoke.remove();
                rocketLaunchSound.pause();
                rocketLaunchSound.currentTime = 0;
                countdownSound.pause();
                countdownSound.currentTime = 0;
                
                // Fade out launch screen
                launch.classList.remove('active');
                
                // Play transition video after fade out
                setTimeout(() => {
                    launch.style.display = 'none';
                    playTransitionVideo('Launch_Transition.mp4', 4);
                }, 500);
            }, 2200);
            
            clearInterval(countInterval);
        }
    }, 1000);
}

document.addEventListener('keydown', e => {
    // Ignore all input during stage transitions
    if (stageTransitioning) return;

    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    // Start intro music on first interaction
    if (!musicStarted) {
        musicStarted = true;
        playMusic(introMusic);
    }

    // S key to skip stage
    if (e.key === 's' || e.key === 'S') {
        if (stage === 1) showStage(2);
        else if (stage === 2) showStage(3);
        else if (stage === 3) showStage(3.5);
        else if (stage === 3.5) showStage(4);
        else if (stage === 4) showStage(4.5);
        else if (stage === 4.5) showStage(5);
        else if (stage === 5) showStage(6);
        return;
    }

    // R key to restart current stage
    if (e.key === 'r' || e.key === 'R') {
        showStage(stage);
        return;
    }

    if (e.key === 'Enter' && stage === 6) {
        location.reload();
        return;
    }

    if (stage === 1 && e.key === ' ') {
        // Lock mouse inputs once game starts
        mouseInputsLocked = true;
        showStage(2);
        return;
    }

    if (stage === 2 && e.key === "ArrowRight") {
        if (inputLocked) return;
        inputLocked = true;
        setTimeout(() => inputLocked = false, INPUT_DELAY);

        groundLeft += 18;
        zGround.style.left = groundLeft + '%';
        playMovementSound(drivingSound, 'driving');
        if (groundLeft >= 88) showStage(3);
        return;
    }

    if (stage === 3) {
        if (inputLocked) return;
        
        if (e.key === "ArrowRight") {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            playMovementSound(drivingSound, 'driving');
            if (!reachedDino) {
                dinoLeft += 10;
                zDino.style.left = dinoLeft + '%';
                if (dinoLeft >= 65) {
                    reachedDino = true;
                    // Play dino roar and shake dino when reaching
                    dinoRoar.currentTime = 0;
                    dinoRoar.play();
                    dinoImg.classList.add('shake-dino');
                    setTimeout(() => dinoImg.classList.remove('shake-dino'), 500);
                }
            } else if (upPresses === 2) {
                dinoLeft += 10;
                zDino.style.left = dinoLeft + '%';
                if (dinoLeft >= 100) showStage(3.5);
            }
        }
        if (e.key === "ArrowUp" && reachedDino && upPresses < 2) {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            playMovementSound(drivingSound, 'driving-up');
            upPresses++;
            dinoBottom += 15;
            zDino.style.bottom = dinoBottom + '%';
        }
        return;
    }

    // Launch stage controls
    if (stage === 3.5) {
        if (inputLocked) return;
        
        // Phase 1: Walk to tower
        if (launchPhase === 1 && e.key === 'ArrowRight') {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            playMovementSound(walkingSound, 'walking');
            launchZackyLeft += 10;
            if (launchZackyElement) {
                launchZackyElement.style.left = launchZackyLeft + '%';
            }
            
            if (launchZackyLeft >= 62) {
                launchPhase = 2;
                launchTitle.textContent = 'Press Space to Climb!';
            }
        }
        // Phase 2: Start climbing
        else if (launchPhase === 2 && e.key === ' ') {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            launchPhase = 3;
            if (launchZackyElement) {
                launchZackyElement.src = 'Zacky_climb.png';
            }
            launchTitle.textContent = 'Climb Up!';
        }
        // Phase 3: Climb up
        else if (launchPhase === 3 && e.key === 'ArrowUp') {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            playMovementSound(climbingSound, 'climbing');
            climbBottom += 12;
            if (launchZackyElement) {
                launchZackyElement.style.bottom = climbBottom + '%';
            }
            
            if (climbBottom >= 60) {
                launchPhase = 4;
                
                // Remove Zacky
                if (launchZackyElement) {
                    launchZackyElement.remove();
                    launchZackyElement = null;
                }
                
                // Change rocket to manned
                rocketLaunch.src = 'rocket_manned.png';
                
                launchTitle.textContent = 'Press Enter to Launch!';
            }
        }
        // Phase 4: Launch!
        else if (launchPhase === 4 && e.key === 'Enter') {
            inputLocked = true;
            launchPhase = 5;
            launchCountdown();
        }
        
        return;
    }

    if (stage === 4 && e.key === "ArrowRight") {
        if (inputLocked) return;
        inputLocked = true;
        setTimeout(() => inputLocked = false, INPUT_DELAY);

        prevLeft = spaceLeft;
        prevBottom = spaceBottom;

        spaceLeft += 9;
        spaceBottom += 8;
        zSpace.style.left = spaceLeft + '%';
        zSpace.style.bottom = spaceBottom + '%';

        playMovementSound(thrustersSound, 'thrusters');
        rocketExhaust(prevLeft, prevBottom);

        spacePresses++;

        if (!monster) {
            monster = document.createElement('img');
            monster.src = 'monster_space.png';
            monster.style.position = 'absolute';
            monster.style.left = '75%';
            monster.style.bottom = '10%';
            monster.style.width = '280px';
            monster.style.transition = 'left 1.4s ease, bottom 1.6s ease';
            monster.style.zIndex = '4';
            space.appendChild(monster);
            monsterSound();
        } else {
            monster.style.left = (parseFloat(monster.style.left) - 6) + '%';
            monster.style.bottom = (parseFloat(monster.style.bottom) + 5) + '%';
        }

        if (spacePresses === 3) {
            mouse = document.createElement('img');
            mouse.src = 'mouse_space.png';
            mouse.className = 'space-mouse';
            space.appendChild(mouse);
        }
        if (spacePresses === 6 && mouse) mouse.remove();

        if (spaceLeft >= 75 && spaceBottom >= 65) showStage(4.5);
        return;
    }

    if (stage === 4.5) {
        if (inputLocked) return;
        
        const zCollect = document.getElementById('zacky-collect');
        let moved = false;
        let movementType = '';
        
        if (e.key === "ArrowUp" && collectBottom < 77) {
            collectBottom += 8;
            collectRotation = 0;
            moved = true;
            movementType = 'thrusters-up';
        }
        if (e.key === "ArrowDown" && collectBottom > 13) {
            collectBottom -= 8;
            collectRotation = 180;
            moved = true;
            movementType = 'thrusters-down';
        }
        if (e.key === "ArrowLeft" && collectLeft > 13) {
            collectLeft -= 8;
            collectRotation = -90;
            moved = true;
            movementType = 'thrusters-left';
        }
        if (e.key === "ArrowRight" && collectLeft < 77) {
            collectLeft += 8;
            collectRotation = 90;
            moved = true;
            movementType = 'thrusters-right';
        }
        
        if (moved) {
            inputLocked = true;
            setTimeout(() => inputLocked = false, INPUT_DELAY);
            
            zCollect.style.left = collectLeft + '%';
            zCollect.style.bottom = collectBottom + '%';
            zCollect.style.transform = `rotate(${collectRotation}deg)`;
            playMovementSound(thrustersSound, movementType);
            checkCollision();
            checkMoonCenter();
        }
        return;
    }

    if (stage === 5 && e.key === ' ') {
        if (inputLocked) return;
        inputLocked = true;
        setTimeout(() => inputLocked = false, INPUT_DELAY);

        shootLaser();
    }
});

showStage(1);
</script>
