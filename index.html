<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zacky's Adventures!</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Arial Rounded MT Bold',Arial,sans-serif;color:#fff;overflow-x:hidden;
 background:#001a33 url('game2/background1_landing.jpg') center/cover no-repeat fixed;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:3vh 3vw;min-height:100vh}
h1{font-size:clamp(2.2rem,7vw,5.5rem);text-align:center;text-shadow:4px 4px 0 #c0392b,8px 8px 0 rgba(0,0,0,.35);letter-spacing:2px;animation:bob 2.4s ease-in-out infinite}
.sub{font-size:clamp(1rem,2.5vw,1.6rem);text-shadow:2px 2px 4px #000}
.cards{display:flex;gap:4vw;flex-wrap:wrap;justify-content:center;width:100%}
.card{display:flex;flex-direction:column;align-items:center;width:min(40vw,440px);min-width:260px;text-decoration:none;color:#fff;
 border:6px solid #fff;border-radius:28px;overflow:hidden;background:#0b5394;box-shadow:0 10px 0 #073763,0 14px 30px rgba(0,0,0,.5);
 transition:transform .15s,box-shadow .15s;outline:none}
.card .pic{width:100%;aspect-ratio:16/9;background-size:cover;background-position:center;position:relative}
.card .pic img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:90%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.card .label{padding:14px 10px 18px;text-align:center}
.card .num{font-size:clamp(1.6rem,4vw,2.6rem);color:#ffd84d;text-shadow:3px 3px 0 #000}
.card .name{font-size:clamp(1rem,2.4vw,1.5rem)}
.card.g2{background:#0e8f8f;box-shadow:0 10px 0 #075e5e,0 14px 30px rgba(0,0,0,.5)}
.card:hover,.card.sel{transform:translateY(-8px) scale(1.04);border-color:#ffd84d}
.card.sel{box-shadow:0 0 0 8px #ffd84d,0 14px 30px rgba(0,0,0,.5)}
.hint{font-size:clamp(.9rem,2vw,1.2rem);background:rgba(0,0,0,.45);padding:8px 16px;border-radius:20px}
#mute{position:fixed;top:14px;right:14px;font-size:28px;width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:#c0392b;color:#fff;cursor:pointer}
#tap{position:fixed;top:22px;right:80px;background:#ffd84d;color:#000;padding:8px 14px;border-radius:18px;font-size:1rem;animation:pulse 1.2s infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<h1>Zacky's Adventures!</h1>
<div class="sub">Pick a game!</div>
<div class="cards">
 <a class="card g1 sel" href="./game1/" id="c1">
  <div class="pic" style="background-image:url('game1/space_background.jpg')"><img src="game1/zacky_space.png" alt=""></div>
  <div class="label"><div class="num">Game 1</div><div class="name">Zacky's Paw Patrol Adventure!</div></div>
 </a>
 <a class="card g2" href="./game2/" id="c2">
  <div class="pic" style="background-image:url('game2/background5_ocean.jpg')"><img src="game2/Zacky_submarine.png" alt=""></div>
  <div class="label"><div class="num">Game 2</div><div class="name">Zacky's Water Adventure!</div></div>
 </a>
</div>
<div class="hint">Tap a game, or use ← → and Enter</div>
<button id="mute" aria-label="Mute music">🔇</button>
<div id="tap">🎵 Tap for music</div>
<audio id="music" src="game2/End_Music.mp3" loop preload="auto"></audio>
<script>
const m=document.getElementById('music'),btn=document.getElementById('mute'),tap=document.getElementById('tap');
const cards=[...document.querySelectorAll('.card')];let i=0,muted=false,started=false;
function ui(){btn.textContent=(muted||!started)?'🔇':'🔊';}
function start(){if(started||muted)return;m.volume=.6;m.play().then(()=>{started=true;tap.style.display='none';ui();}).catch(()=>{});}
btn.addEventListener('click',e=>{e.stopPropagation();if(!started){muted=false;start();return;}muted=!muted;m.muted=muted;ui();});
['pointerdown','keydown','touchstart'].forEach(t=>addEventListener(t,start,{passive:true}));
function sel(n){i=(n+cards.length)%cards.length;cards.forEach((c,k)=>c.classList.toggle('sel',k===i));cards[i].focus();}
cards.forEach((c,k)=>c.addEventListener('mouseenter',()=>sel(k)));
addEventListener('keydown',e=>{
 if(['ArrowRight','ArrowDown'].includes(e.key)){sel(i+1);e.preventDefault();}
 else if(['ArrowLeft','ArrowUp'].includes(e.key)){sel(i-1);e.preventDefault();}
 else if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href=cards[i].getAttribute('href');}
});
ui();
</script>
</body>
</html>
